<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 三栏工作台（工单队列 · 6 步办理流程 · 证据包与留痕），窄屏堆叠为单列 */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --sunk:#eaeef0; --line:#d6dde1; --line-soft:#e4e9ec;
  --fg:#16232b; --muted:#5b6b75; --faint:#8796a0;
  --accent:#1d5c6b; --accent-soft:#e0eef1; --accent-fg:#ffffff;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#fbe6e4;
  --hl:#fff2b8; --shadow:0 1px 2px rgba(22,35,43,.06),0 4px 16px rgba(22,35,43,.05);
  --f-display:"Noto Serif SC","Songti SC",serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1619; --panel:#162126; --sunk:#111b1f; --line:#2a3a41; --line-soft:#22313a;
  --fg:#e3eaed; --muted:#9db0b9; --faint:#6f838d;
  --accent:#5fb3c4; --accent-soft:#18343b; --accent-fg:#0b1a1e;
  --ok:#5cc58f; --ok-soft:#143326; --warn:#e2ad4a; --warn-soft:#352a12; --bad:#f08279; --bad-soft:#3a1916;
  --hl:#4a3f12; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1619; --panel:#162126; --sunk:#111b1f; --line:#2a3a41; --line-soft:#22313a;
  --fg:#e3eaed; --muted:#9db0b9; --faint:#6f838d;
  --accent:#5fb3c4; --accent-soft:#18343b; --accent-fg:#0b1a1e;
  --ok:#5cc58f; --ok-soft:#143326; --warn:#e2ad4a; --warn-soft:#352a12; --bad:#f08279; --bad-soft:#3a1916;
  --hl:#4a3f12; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font:700 18px/1.2 var(--f-display);letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:8px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:6px;color:var(--muted);font-size:13px}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--fg);font-weight:500;box-shadow:var(--shadow)}
.ctrls{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 10px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.switch input{accent-color:var(--bad)}
.user{display:flex;align-items:center;gap:8px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
@media (max-width:760px){.top{position:static}}
.demo-note{background:var(--warn-soft);color:var(--warn);font-size:12px;padding:5px 16px;text-align:center}

/* workbench */
.wrap{padding:16px;padding-block:16px 40px}
.bench{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;gap:16px;align-items:start;max-width:1500px;margin:0 auto}
@media (max-width:1180px){.bench{grid-template-columns:220px minmax(0,1fr)}.side{grid-column:1/-1}}
@media (max-width:760px){.bench{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.ph{padding:12px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph h2{font:600 14px/1.3 var(--f-body)}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}

.queue{display:flex;flex-direction:column}
.qitem{border:0;background:none;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line-soft);display:grid;gap:4px}
.qitem:last-child{border-bottom:0}
.qitem[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.qitem .t{font-weight:500}
.qitem .m{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1;padding:4px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.ac{background:var(--accent-soft);color:var(--accent)}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;padding:14px 14px 10px;border-bottom:1px solid var(--line-soft);overflow-x:auto}
.st{border:0;background:none;padding:0 4px;display:grid;justify-items:center;gap:6px;position:relative;min-width:64px;font-size:12px;color:var(--faint)}
.st::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.st:first-child::before{display:none}
.st .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);font:500 12px var(--f-mono);position:relative;z-index:1}
.st.done{color:var(--muted)}.st.done .n{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}.st.done::before,.st.cur::before{background:var(--accent)}
.st.cur{color:var(--fg);font-weight:500}.st.cur .n{border-color:var(--accent);color:var(--accent)}
.st.blocked .n{border-color:var(--bad);color:var(--bad)}
.st:disabled{cursor:default}

.body{padding:18px;display:grid;gap:16px}
.step-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.step-h h3{font:700 20px/1.3 var(--f-display)}
.step-h p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.sunk{background:var(--sunk);border-radius:8px;padding:14px}
.quote{font-size:15px;line-height:1.85}
mark{background:var(--hl);color:inherit;padding:1px 2px;border-radius:3px}
mark sup{font:500 10px var(--f-mono);color:var(--accent);margin-left:2px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.field{border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;background:var(--panel)}
.field .k{font-size:12px;color:var(--faint)}.field .v{font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:7px;font-size:13px}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.alert{border-radius:8px;padding:12px 14px;display:grid;gap:4px;border:1px solid}
.alert b{font-weight:600}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--fg)}.alert.bad b{color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}.alert.warn b{color:var(--warn)}
.alert.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}.alert.ok b{color:var(--ok)}
.alert.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}.alert.info b{color:var(--accent)}

.cand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.cand.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cand.dis{cursor:not-allowed;opacity:.65}
.cand input{margin-top:5px;accent-color:var(--accent)}
.cand .name{font-weight:600}
.score{font:500 13px var(--f-mono);color:var(--accent);text-align:right}
.bar{height:4px;background:var(--sunk);border-radius:2px;margin-top:4px;width:72px}.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.basis{grid-column:2/-1;display:grid;gap:6px}
.cite{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:13px;padding:8px 10px;border-radius:6px;background:var(--sunk)}
.cite .src{color:var(--muted);font-size:12px}
.tag{font:500 11px/1 var(--f-mono);padding:4px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;height:max-content}
.tag.R{background:var(--ok-soft);color:var(--ok)}.tag.C{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}.tag.X{background:var(--bad-soft);color:var(--bad)}
.note{font-size:12px;color:var(--muted)}

.gw{display:grid;gap:6px}
.gwrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:8px 10px;border-radius:6px;background:var(--sunk)}
.dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--line);color:var(--faint)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:var(--panel)}.dot.bad{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.dot.run{border-color:var(--accent);border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.timeline{display:grid;gap:0;position:relative}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px dashed var(--line-soft)}
.rec:last-child{border-bottom:0}
.rec .when{font:12px var(--f-mono);color:var(--muted);white-space:nowrap}

.draft{display:grid;gap:8px}
.sent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;border:1px solid var(--line-soft);background:var(--panel)}
.sent.bad{border-color:var(--bad);background:var(--bad-soft)}
.sent.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.sent .why{grid-column:1/-1;font-size:12px;color:var(--muted)}
.sent.bad .why{color:var(--bad)}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.asks{display:grid;gap:6px}
.ask{display:flex;gap:8px;align-items:center;font-size:13px}
textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:8px;padding:12px;font:14px/1.8 var(--f-body);background:var(--panel);color:var(--fg);resize:vertical}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px}
label.chk input{accent-color:var(--accent)}
.loader{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.loader .dot{width:14px;height:14px}

/* side */
.side{display:grid;gap:16px}
.ev{display:grid;gap:6px;padding:12px 14px}
.legend{display:grid;gap:4px;font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line-soft)}
.legend div{display:flex;gap:8px;align-items:center}
.log{list-style:none;margin:0;padding:6px 14px 12px;display:grid;gap:0;max-height:440px;overflow:auto}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.log li:last-child{border-bottom:0}
.log .lt{font:11px var(--f-mono);color:var(--faint);padding-top:2px}
.log .who{color:var(--muted);font-size:11px}
.log li.block .txt{color:var(--bad)}
.log li.shadow .txt{color:var(--warn)}
.empty{color:var(--faint);font-size:12px;padding:14px}

/* other tabs */
.page{max-width:1100px;margin:0 auto;display:grid;gap:16px}
.page-h h2{font:700 22px/1.3 var(--f-display)}
.page-h p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-weight:500;color:var(--faint);font-size:12px;background:var(--sunk)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.off td{color:var(--faint)}
tr.off td:first-child{text-decoration:line-through}
.phases{display:grid;grid-template-columns:2fr 3fr 3fr 4fr;gap:4px;padding:14px}
.phase{padding:10px 12px;border-radius:6px;background:var(--sunk);font-size:12px;display:grid;gap:2px;min-width:0}
.phase b{font-size:13px}
.phase.done{background:var(--accent-soft)}.phase.now{background:var(--accent);color:var(--accent-fg)}.phase.now span{color:inherit;opacity:.85}
.phase span{color:var(--muted)}
@media (max-width:700px){.phases{grid-template-columns:1fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{padding:14px;display:grid;gap:6px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font:600 24px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi .th{font-size:12px;color:var(--faint)}
.meter{height:6px;background:var(--sunk);border-radius:3px;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- state ---------- */
const S={tab:'work',tid:TICKETS[0].id,mode:'live',modelDown:false,per:{},log:[],busy:false};
TICKETS.forEach(t=>S.per[t.id]={step:0,max:0,dept:null,coordinated:false,dispatched:false,gw:null,recs:t.recs.partial?'partial':'full',draft:null,fixed:false,returned:false,checked:false,ack:false,sent:false,final:''});
const tk=()=>TICKETS.find(t=>t.id===S.tid);
const P=()=>S.per[S.tid];
let clock=new Date(2026,9,9,9,12);
const now=()=>{clock=new Date(clock.getTime()+60000*(1+Math.floor(Math.random()*3)));return clock.toTimeString().slice(0,5)};
function log(text,kind='info',who='李晓'){S.log.unshift({t:now(),tid:S.tid,who,text,kind});}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const tag=id=>{const e=EV[id];return `<span class="tag ${e.t}">${id}</span>`};
const cite=id=>{const e=EV[id];return `<div class="cite">${tag(id)}<div><div>${e.q}</div><div class="src">${e.src} · ${e.valid}</div></div></div>`};
function hlText(t){let i=0;return t.text.replace(/\{([^|}]+)\|([^}]+)\}/g,(_,a,b)=>`<mark>${a}<sup>${b}</sup></mark>`)}
function statusOf(t){const p=S.per[t.id];
  if(p.sent)return S.mode==='shadow'?['影子已记录','warn']:['已答复','ok'];
  if(p.step===4&&p.draft&&!checkPass(t,p))return['待补证','bad'];
  if(p.dispatched)return['办理中','ac'];
  return['待分办',''];}
function curDraft(t,p){if(!p.draft)return null;let d=t.drafts[p.draft].map(x=>({...x}));if(p.fixed)d=d.map(x=>x.bad&&x.fix?{...x.fix,asks:[],wasFixed:true}:x);return d}
function coverage(t,p){const d=curDraft(t,p)||[];const cov=new Set();d.forEach(x=>{if(!x.bad)(x.asks||[]).forEach(a=>cov.add(a))});return t.asks.map(a=>({...a,ok:cov.has(a.id)}))}
function checkPass(t,p){const d=curDraft(t,p);if(!d)return false;return d.every(x=>!x.bad)&&coverage(t,p).every(a=>a.ok)}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
  $('#modelDown').checked=S.modelDown;
  $('#app').innerHTML=S.tab==='work'?renderWork():S.tab==='kb'?renderKB():renderPilot();
}

function renderWork(){
  const t=tk(),p=P();
  const q=TICKETS.map(x=>{const [s,c]=statusOf(x);return `<button class="qitem" data-act="pick" data-id="${x.id}" aria-current="${x.id===S.tid}">
     <span class="t">${x.title}${x.urgent?' <span class="pill bad">加急</span>':''}</span>
     <span class="m"><span class="mono">${x.id.slice(-4)}</span>·<span>${x.cat.split(' · ')[0]}</span>·<span>${x.time}</span></span>
     <span class="m"><span class="pill ${c}">${s}</span><span>时限 ${x.limit}</span></span></button>`}).join('');
  const stepper=STEPS.map((s,i)=>{const cls=i<p.step||(i<=p.max&&i!==p.step)?'done':i===p.step?'cur':'';
     const blocked=i===4&&p.draft&&!checkPass(t,p)&&p.step===4;
     return `<button class="st ${cls} ${blocked?'blocked':''}" data-act="goto" data-i="${i}" ${i>p.max?'disabled':''}><span class="n">${String(i+1).padStart(2,'0')}</span><span>${s}</span></button>`}).join('');
  return `<div class="bench">
    <aside class="panel"><div class="ph"><h2>待办工单</h2><span class="pill">${TICKETS.length}</span></div><div class="queue">${q}</div></aside>
    <section class="panel"><div class="stepper">${stepper}</div><div class="body">${[s0,s1,s2,s3,s4,s5][p.step](t,p)}</div></section>
    <aside class="side">${renderEvidence(t,p)}${renderLog()}</aside>
  </div>`;
}

function head(title,desc,extra=''){return `<div class="step-h"><div><div class="eyebrow">${tk().id} · ${tk().cat}</div><h3>${title}</h3><p>${desc}</p></div>${extra}</div>`}
function shadowNote(){return S.mode==='shadow'?`<div class="alert warn"><b>影子运行中</b><span>系统只给出建议并与人工结果对照，不执行派单或发送。切换到“人工确认上线”可执行写入。</span></div>`:''}
function degrade(){return `<div class="alert bad"><b>模型服务超时，已转原平台人工处理</b><span>人工办理不受影响。超时事件已记入监控告警；恢复后可重新调用协办。</span><div class="actions" style="margin-top:6px"><button class="btn" data-act="openLegacy">在原平台人工办理</button><button class="btn ghost" data-act="recover">模拟服务恢复</button></div></div>`}

/* step 0 */
function s0(t,p){
  return head('接入工单','从市民原话中提取地点与诉求。高亮部分为抽取依据，承办人可直接核对。')+
  `<div class="sunk"><div class="note" style="margin-bottom:6px">${t.channel} · ${t.time} · ${t.citizen}</div><div class="quote">${hlText(t)}</div></div>
   <div class="fields">${t.fields.map(([k,v])=>`<div class="field"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
   ${t.attach?`<div class="alert warn"><b>附件中的指令性文字已隔离</b><span>${t.attach.name} 中识别到文字“${t.attach.ocr}”。附件内容只作为数据，不会改变办理流程。</span></div>`:''}
   <div class="actions"><button class="btn pri" data-act="next">检索职责</button><span class="note">诉求共 ${t.asks.length} 项，答复时逐项核对是否覆盖</span></div>`;
}

/* step 1 */
function s1(t,p){
  if(S.modelDown)return head('检索职责','按属地和有效期核对候选承办单位。')+degrade();
  const conflictOpen=t.conflict&&!p.coordinated;
  const rows=t.cands.map((c,i)=>{const dis=c.status==='expired'||conflictOpen&&i<2&&false;const sel=p.dept===i;
    const pill=c.status==='ok'?'<span class="pill ok">依据有效</span>':c.status==='warn'?'<span class="pill warn">条件不符</span>':'<span class="pill bad">依据失效</span>';
    return `<label class="cand ${sel?'sel':''} ${c.status==='expired'?'dis':''}"><input type="radio" name="dept" id="dept${i}" data-act="dept" data-i="${i}" ${sel?'checked':''} ${c.status==='expired'?'disabled':''}>
      <div><div class="name">${c.dept}</div><div class="note">${pill} ${c.note}</div></div>
      <div><div class="score">${Math.round(c.score*100)}</div><div class="bar"><i style="width:${c.score*100}%"></i></div></div>
      <div class="basis">${c.basis.map(cite).join('')}</div></label>`}).join('');
  return head('检索职责','只召回在用版本的职责依据。前三位候选及其依据如下，最终分办由承办人确认。')+
   (conflictOpen?`<div class="alert bad"><b>职责冲突，系统不给出确定结论</b><span>${t.conflict}</span><div class="actions" style="margin-top:6px"><button class="btn" data-act="coord">发起人工协调</button><span class="note">或要求市民补充现场照片后重试</span></div></div>`:'')+
   (t.conflict&&p.coordinated?`<div class="alert ok"><b>冲突已解除</b><span>${t.resolved}</span></div>`:'')+
   `<div style="display:grid;gap:10px">${rows}</div>
   <div class="actions"><button class="btn pri" data-act="next" ${p.dept==null||conflictOpen?'disabled':''}>提交人工确认</button>
   <span class="note">${conflictOpen?'冲突解除前不能提交':p.dept==null?'请选择承办单位':'已选：'+t.cands[p.dept].dept}</span></div>`;
}

/* step 2 */
const GW=[['身份与权限','李晓 · 区城管委协办员，可向本区部门分办'],['工单版本','v3，与平台当前版本一致'],['幂等键','dispatch-'+'%ID%'+'-v3'],['人工确认','承办人已确认分办对象']];

  const c=t.cands[p.dept];

    <div class="card" style="display:grid;gap:8px"><div class="eyebrow">网关拦截测试</div><div class="actions">
    <button class="btn danger" data-act="dup">重复提交同一分办</button><button class="btn danger" data-act="cross">以街道账号派往外区</button><button class="btn danger" data-act="expired">用过期授权写入</button></div>
    <div id="gwmsg"></div></div>
    <div class="actions"><button class="btn pri" data-act="next">读取处置记录</button></div>`;}
  return head('人工确认','承办人确认后，写入请求还要经过工具网关校验。授权在服务端执行，模型不能绕过。')+shadowNote()+

    <div class="card gw"><div class="eyebrow" style="margin-bottom:4px">工具网关校验</div>${gw}</div>
    ${p.dispatched?after:`<div class="actions"><button class="btn pri" data-act="dispatch" ${p.gw!=null?'disabled':''}>${S.mode==='shadow'?'记录分办建议':'确认分办'}</button><button class="btn ghost" data-act="back">返回修改</button></div>`}`;

  if(S.modelDown)return head('读取处置记录','')+degrade();

  const scen=t.recs.partial?`<div class="seg" id="scen"><button data-act="scen" data-v="partial" aria-pressed="${p.recs==='partial'}">记录仅“已到场”</button><button data-act="scen" data-v="full" aria-pressed="${p.recs==='full'}">记录已完工</button></div>`:'';
  return head('读取处置记录','处置记录证明“做了什么”。草稿中的每个事实都要绑定到记录或职责依据。',scen?`<div style="display:grid;gap:4px;justify-items:end"><span class="note">演示场景</span>${scen}</div>`:'')+
   `<div class="card"><div class="eyebrow">平台处置记录（${recs.length} 条）</div><div class="timeline">${recs.map(id=>`<div class="rec">${tag(id)}<div><div>${EV[id].q}</div><div class="note">${EV[id].src} · ${EV[id].valid}</div></div></div>`).join('')}</div></div>
   ${p.drafting?`<div class="loader"><span class="dot run"></span>起草智能体正在生成草稿…</div>`:`<div class="actions"><button class="btn pri" data-act="gen">生成有引用的草稿</button></div>`}`;

/* step 4 */
function s4(t,p){
  const d=curDraft(t,p),cov=coverage(t,p),pass=checkPass(t,p);
  const rows=d.map(x=>{const cls=x.bad?'bad':x.courtesy?'':'ok';
    const chips=x.courtesy?'<span class="pill">礼貌用语</span>':x.bad?'<span class="tag X">无证据</span>':x.c.map(tag).join('');
    const why=x.bad?`<div class="why">${x.bad}</div>`:x.wasFixed?`<div class="why">已改写为进度答复，依据 R1</div>`:'';
    return `<div class="sent ${cls}"><div>${x.s}</div><div class="chips">${chips}</div>${why}</div>`}).join('');
  const asks=cov.map(a=>`<div class="ask"><span class="dot ${a.ok?'ok':'bad'}">${a.ok?'✓':'!'}</span>${a.text}<span class="pill ${a.ok?'ok':'bad'}">${a.ok?'已答复':'漏答'}</span></div>`).join('');
  const hasBad=d.some(x=>x.bad);
  let block='';
  if(!pass){
    block=`<div class="alert bad"><b>校验未通过，草稿不能进入审核</b><span>${hasBad?'存在没有证据支持的结论。':''}${cov.some(a=>!a.ok)?'存在未答复的诉求。':''}</span>
    <div class="actions" style="margin-top:6px">${hasBad?`<button class="btn" data-act="fix">改写为进度答复</button>`:''}<button class="btn pri" data-act="ret" ${p.returned?'disabled':''}>退回承办单位补证</button></div></div>`;
    if(p.returned)block+=`<div class="card"><div class="eyebrow">补证清单 · 已发送至 ${t.cands[p.dept].dept}</div><ol style="margin:6px 0 0;padding-left:20px">${t.supplement.map(s=>`<li>${s}</li>`).join('')}</ol><div class="loader" style="margin-top:8px"><span class="dot run"></span>等待承办单位回填…</div></div>`;
  } else block=`<div class="alert ok"><b>校验通过</b><span>关键结论全部有证据支持，诉求 ${cov.length}/${cov.length} 已答复。</span></div><div class="actions"><button class="btn pri" data-act="next">进入人工审核</button></div>`;
  return head('事实校验','校验智能体逐句核对：结论是否有原文支持，诉求是否全部答复。缺证据时只输出待补材料。')+
   `<div class="draft">${rows}</div><div class="card"><div class="eyebrow" style="margin-bottom:6px">诉求覆盖</div><div class="asks">${asks}</div></div>${block}`;
}

/* step 5 */
function s5(t,p){
  const d=curDraft(t,p);
  if(!p.final)p.final=d.map(x=>x.s).join('');
  const used=[...new Set(d.flatMap(x=>x.c))];
  if(p.sent)return head('人工审核','')+`<div class="alert ${S.mode==='shadow'?'warn':'ok'}"><b>${S.mode==='shadow'?'影子运行：答复草稿已存档，未发送':'答复已发送'}</b><span>${S.mode==='shadow'?'将与人工实际答复对照，计入退回率与耗时评测。':'回执号 RC-'+t.id.slice(-4)+'-02。工单状态由承办人在原平台更新，系统不自动结案。'}</span></div>
   <div class="sunk quote">${p.final}</div><div class="note">引用依据：${used.join('、')} · 审核人：李晓 · 已留痕</div>
   <div class="actions"><button class="btn" data-act="nextTicket">办理下一件</button></div>`;
  return head('人工审核','承办人可直接修改答复。确认发送前，需勾选已核对引用依据。')+shadowNote()+
   `<textarea id="final" aria-label="答复内容">${p.final}</textarea>
   <div class="note">引用依据：${used.map(tag).join(' ')}</div>
   <label class="chk"><input type="checkbox" id="ack" data-act="ack" ${p.ack?'checked':''}>我已逐条核对引用依据，确认答复内容</label>
   <div class="actions"><button class="btn pri" data-act="send" ${p.ack?'':'disabled'}>${S.mode==='shadow'?'存档草稿（不发送）':'确认发送'}</button><button class="btn ghost" data-act="back">返回校验</button></div>`;
}

function renderEvidence(t,p){
  const ids=new Set();
  if(p.dept!=null)t.cands[p.dept].basis.forEach(i=>ids.add(i));
  if(p.step>=3)t.recs[p.recs].forEach(i=>ids.add(i));
  const list=[...ids];
  return `<div class="panel"><div class="ph"><h2>证据包</h2><span class="pill">${list.length} 条</span></div>
   ${list.length?`<div class="ev">${list.map(cite).join('')}</div>`:'<div class="empty">选择承办单位后，依据会汇集在这里。</div>'}
   <div class="legend"><div>${tag('P1').replace('P1','P')}政策职责：证明谁负责</div><div><span class="tag R">R</span>处置记录：证明做了什么</div><div><span class="tag C">C</span>历史案例：只作参考</div></div></div>`;
}
function renderLog(){
  const L=S.log.filter(l=>l.tid===S.tid);
  return `<div class="panel"><div class="ph"><h2>操作留痕</h2><span class="note">本工单</span></div>
  ${L.length?`<ul class="log">${L.map(l=>`<li class="${l.kind}"><span class="lt">${l.t}</span><div><div class="txt">${l.text}</div><div class="who">${l.who}</div></div></li>`).join('')}</ul>`:'<div class="empty">暂无操作。每次确认、拦截和发送都会记录审批人、引用版本和幂等键。</div>'}</div>`;
}

/* knowledge base */
function renderKB(){
  const rows=KB.map((k,i)=>{const pill=k.st==='在用'?'ok':k.st==='失效'?'bad':'warn';
   return `<tr class="${k.st==='失效'?'off':''}"><td>${k.name}</td><td>${k.type}</td><td class="num">${k.ver}</td><td>${k.valid}</td><td>${k.owner}</td>
   <td><span class="pill ${pill}">${k.st==='失效'?'已失效 · 停止召回':k.st}</span></td>
   <td>${k.st==='待审核'?`<button class="btn" data-act="publish" data-i="${i}">审核发布</button>`:k.st==='失效'?'<span class="note">旧工单保留快照</span>':''}</td></tr>`}).join('');
  return `<div class="page"><div class="page-h"><h2>职责知识库</h2><p>业务部门指定维护人。新增文件审核后发布，失效版本停止召回，已办工单保留引用时的版本快照。</p></div>
  <div class="panel tbl-wrap"><table><thead><tr><th>文件</th><th>类型</th><th>版本</th><th>有效期</th><th>维护人</th><th>状态</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="alert info"><b>检索时的过滤顺序</b><span>权限 → 地区 → 版本有效期 → 相关度。历史案例可被召回，但不能作为职责依据。</span></div></div>`;
}

/* pilot */
function renderPilot(){
  const K=[
    {k:'准备耗时（中位数）',v:'-34.6%',sub:'18.5 → 12.1 分钟',th:'门槛：下降 ≥30%',ok:true,val:34.6,max:50,line:30},
    {k:'证据支持率',v:'96.2%',sub:'双人盲审 412 条关键结论',th:'门槛：≥95%',ok:true,val:96.2,max:100,line:95,min:80},
    {k:'承办候选覆盖率',v:'88.4%',sub:'确认单位在前三候选中',th:'门槛：≥90%',ok:false,val:88.4,max:100,line:90,min:80},
    {k:'越权写入拦截',v:'42 / 42',sub:'跨部门、过期授权、重复提交',th:'门槛：全部拦截',ok:true,val:100,max:100,line:100,min:0},
    {k:'人工退回率',v:'7.9%',sub:'试点前基线 8.3%',th:'门槛：不高于基线',ok:true,val:7.9,max:12,line:8.3,min:0,lower:true}];
  const kp=K.map(x=>{const mn=x.min||0;const pct=(x.val-mn)/(x.max-mn)*100,lp=(x.line-mn)/(x.max-mn)*100;
   return `<div class="panel kpi"><div class="k">${x.k}</div><div class="v" style="color:var(--${x.ok?'ok':'bad'})">${x.v}</div><div class="note">${x.sub}</div>
   <div class="meter"><i style="width:${Math.min(pct,100)}%;background:var(--${x.ok?'ok':'bad'})"></i><b style="left:${Math.min(lp,99.5)}%"></b></div>
   <div class="th">${x.th} · <span class="pill ${x.ok?'ok':'bad'}">${x.ok?'达标':'未达标'}</span></div></div>`}).join('');
  const done=S.log.filter(l=>l.kind==='ok'||l.kind==='shadow').length;
  return `<div class="page"><div class="page-h"><h2>试点看板</h2><p>12 周区级试点，覆盖 3 个部门、20 名工作人员。以下为示例数据（影子运行第 7 周），按双方确认的验收方案计算。</p></div>
  <div class="panel"><div class="ph"><h2>实施阶段</h2><span class="pill ac">当前：第 7 周</span></div>
   <div class="phases"><div class="phase done"><b>第 1–2 周</b><span>访谈、权限梳理、数据授权、历史基线</span></div>
   <div class="phase done"><b>第 3–5 周</b><span>整理职责库，只读检索与离线评测</span></div>
   <div class="phase now"><b>第 6–8 周 · 影子运行</b><span>与人工结果对照，不派单不发送</span></div>
   <div class="phase"><b>第 9–12 周</b><span>人工确认上线，评估后扩大或回退</span></div></div></div>
  <div class="kpis">${kp}</div>
  <div class="alert warn"><b>扩围判断：暂不扩围</b><span>5 项门槛达标 4 项。承办候选覆盖率差 1.6 个百分点，主要集中在井盖、管线类权属不清的工单。建议先补齐排水设施产权台账，第 8 周末复评。</span></div>
  <div class="panel tbl-wrap"><table><thead><tr><th>评测集</th><th>样本</th><th>切分方式</th><th>单列样本</th></tr></thead><tbody>
   <tr><td>开发集 / 保留集</td><td class="num">300 件</td><td>历史工单，按事件去重、按时间切分</td><td>缺证据、跨部门、恶意附件</td></tr>
   <tr><td>前瞻验证集</td><td class="num">200 件</td><td>试点期间新进工单</td><td>同上</td></tr></tbody></table></div>
  <p class="note">本次演示中你已完成 ${done} 次确认操作。数值为演示用假设，不代表真实运行成绩。</p></div>`;
}

/* ---------- actions ---------- */
function gotoStep(i){const p=P();p.step=i;p.max=Math.max(p.max,i);render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{
  const tb=e.target.closest('#tabs button');if(tb){S.tab=tb.dataset.tab;render();return}
  const mb=e.target.closest('#mode button');if(mb){S.mode=mb.dataset.mode;log(`运行模式切换为「${mb.textContent}」`,'info','系统');render();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,t=tk(),p=P();
  if(a==='pick'){S.tid=el.dataset.id;S.tab='work';render();}
  else if(a==='goto'){gotoStep(+el.dataset.i)}
  else if(a==='next'){if(p.step===0)log('工单已接入，抽取地点与诉求 '+t.asks.length+' 项','info','检索智能体');
    if(p.step===1)log('选择承办单位：'+t.cands[p.dept].dept);
    if(p.step===4)log('事实校验通过，进入人工审核','ok','校验智能体');
    gotoStep(p.step+1)}
  else if(a==='back'){gotoStep(p.step-1)}
  else if(a==='dept'){p.dept=+el.dataset.i;render()}
  else if(a==='coord'){el.disabled=true;el.textContent='协调中…';log('发起人工协调：排水所 / 管线办','info');
    setTimeout(()=>{p.coordinated=true;p.dept=0;t.cands[0].score=.94;t.cands[0].note='现场核实为雨水井，职责匹配';t.cands[1].score=.12;t.cands[1].status='warn';t.cands[1].note='已核实非通信井';log('协调完成：确认为雨水井，由排水所承办','ok','排水所 陈涛');render()},1100)}
  else if(a==='dispatch'){p.gw=0;render();const tick=()=>{p.gw++;if(p.gw<GW.length){render();setTimeout(tick,380)}else{p.dispatched=true;
      log(S.mode==='shadow'?'影子：建议分办至 '+t.cands[p.dept].dept+'，未写入':'分办至 '+t.cands[p.dept].dept+' · 幂等键 dispatch-'+t.id.slice(-4)+'-v3',S.mode==='shadow'?'shadow':'ok');render()}};setTimeout(tick,380)}
  else if(a==='dup'||a==='cross'||a==='expired'){
    const m={dup:['重复提交已拦截','幂等键 dispatch-'+t.id.slice(-4)+'-v3 已存在，返回原回执，不重复派单。'],
      cross:['越权写入已拦截','当前账号无权向外区部门分办。附件或对话中的指令也不能提升权限。'],
      expired:['过期授权已拦截','授权令牌已于 09:00 过期，请重新登录后由承办人确认。']}[a];
    log(m[0]+'：'+m[1],'block','工具网关');render();
    const box=$('#gwmsg');if(box)box.innerHTML=`<div class="alert bad"><b>${m[0]}</b><span>${m[1]}</span></div>`;}
  else if(a==='scen'){p.recs=el.dataset.v;p.draft=null;p.fixed=false;p.returned=false;p.final='';p.ack=false;p.max=Math.min(p.max,3);render()}
  else if(a==='gen'){p.drafting=true;render();setTimeout(()=>{p.drafting=false;p.draft=p.recs;p.fixed=false;p.returned=false;p.final='';p.ack=false;
      log('生成草稿 '+t.drafts[p.recs].length+' 句，引用 '+[...new Set(t.drafts[p.recs].flatMap(x=>x.c))].join('、'),'info','起草智能体');
      const pass=checkPass(t,p);log(pass?'校验通过：结论均有依据，诉求全部答复':'校验阻断：发现无证据结论或漏答诉求',pass?'ok':'block','校验智能体');
      gotoStep(4)},900)}
  else if(a==='fix'){p.fixed=true;log('将无证据结论改写为进度答复','info');render()}
  else if(a==='ret'){p.returned=true;log('退回补证：'+t.supplement.length+' 项材料，发送至 '+t.cands[p.dept].dept,'block');render();
      setTimeout(()=>{p.recs='full';p.draft='full';p.fixed=false;p.returned=false;p.final='';
        log('承办单位回填完工记录 R2（工单版本 v4）','info','照明所 张工');log('重新起草并校验通过','ok','校验智能体');render()},1800)}
  else if(a==='ack'){p.ack=el.checked;const f=$('#final');if(f)p.final=f.value;render()}
  else if(a==='send'){const f=$('#final');if(f)p.final=f.value;p.sent=true;
      log(S.mode==='shadow'?'影子：答复草稿存档，未发送':'人工审核通过，答复已发送 · 回执 RC-'+t.id.slice(-4)+'-02',S.mode==='shadow'?'shadow':'ok');render()}
  else if(a==='nextTicket'){const n=TICKETS.find(x=>!S.per[x.id].sent);if(n){S.tid=n.id}render()}
  else if(a==='openLegacy'){log('模型超时，工单转原平台人工处理','block','系统');render()}
  else if(a==='recover'){S.modelDown=false;log('模型服务恢复','info','系统');render()}
  else if(a==='publish'){const k=KB[+el.dataset.i];k.st='在用';k.valid='2026-10-09 起有效';log('审核发布：'+k.name+' '+k.ver,'ok');render()}
});
document.addEventListener('input',e=>{if(e.target.id==='final')P().final=e.target.value});
$('#modelDown').addEventListener('change',e=>{S.modelDown=e.target.checked;log(S.modelDown?'模型服务超时（演示）':'模型服务恢复',S.modelDown?'block':'info','系统');render()});
render();
</script>

</body></html>
