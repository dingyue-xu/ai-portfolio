<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>脚本节点演示</title>
<style>
  /* 产品即深色画布，演示页承诺同一深色世界观（刻意单主题沉浸） */
  :root {
    --bg: #0c0d10;
    --panel: #141518;
    --panel-2: #1b1c20;
    --line: rgba(255, 255, 255, 0.08);
    --ink: #e8eaed;
    --ink-2: #a3a7ad;
    --ink-3: #6d7178;
    --green: #19c37d;
    --amber: #d9a441;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--ink);
    font: 14px/1.7 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 34px 24px 70px; }

  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  .eyebrow { font: 600 10.5px/1 var(--mono); letter-spacing: .14em; color: var(--green); }
  h1 { font-size: 24px; margin: 6px 0 2px; font-weight: 700; letter-spacing: .01em; }
  .lede { color: var(--ink-2); font-size: 13.5px; margin: 0 0 22px; max-width: 46em; }

  /* 步骤条 */
  .steps {
    display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
    padding: 10px 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; position: sticky; top: 12px; z-index: 10;
  }
  .steps button {
    font: inherit; font-size: 12px; color: var(--ink-2); background: none;
    border: 1px solid transparent; border-radius: 7px; padding: 5px 10px; cursor: pointer;
    display: flex; gap: 6px; align-items: center; white-space: nowrap;
  }
  .steps button .n {
    font: 600 10px var(--mono); color: var(--ink-3);
    border: 1px solid var(--line); border-radius: 50%;
    width: 17px; height: 17px; display: grid; place-items: center;
  }
  .steps button.on { color: var(--ink); background: var(--panel-2); border-color: var(--line); }
  .steps button.on .n { color: var(--bg); background: var(--green); border-color: var(--green); }
  .steps button.done .n { color: var(--green); border-color: rgba(25,195,125,.5); }
  .steps button:focus-visible { outline: 2px solid var(--green); outline-offset: -1px; }
  .steps .auto {
    margin-left: auto; font-size: 12px; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 12px;
  }
  .steps .auto.playing { color: var(--bg); background: var(--green); border-color: var(--green); font-weight: 600; }

  /* 展示区 */
  .scene { margin-top: 18px; }
  .scene-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .scene-head h2 { font-size: 18px; margin: 8px 0 2px; }
  .scene-head .cost { font: 600 11px var(--mono); color: var(--amber); }
  .scene-sub { color: var(--ink-2); font-size: 13px; margin: 2px 0 14px; max-width: 52em; }
  .stage {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 26px; min-height: 330px; overflow-x: auto;
  }
  .facts { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--ink-2); }
  .facts b { color: var(--ink); font-weight: 600; }
  .facts span::before { content: "— "; color: var(--ink-3); }

  /* mockup 公共 */
  .node {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; max-width: 460px;
  }
  .node .nt { font-size: 12px; font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
  .node .lock { font-size: 9.5px; color: var(--bg); background: var(--green); border-radius: 3px; padding: 1px 6px; }
  .kv { display: grid; grid-template-columns: 82px 1fr; gap: 3px 10px; font-size: 12px; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; color: var(--ink-2); }
  .btnrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 12px; background: none;
  }
  .btn.primary { color: var(--bg); background: var(--green); border-color: var(--green); font-weight: 600; }
  .at { color: var(--green); }
  .quote {
    font-size: 12px; color: var(--ink-2); line-height: 1.8;
    border-left: 2px solid var(--line); padding-left: 12px; margin: 8px 0 0;
  }
  .cards { display: flex; gap: 14px; flex-wrap: wrap; }
  .acard { width: 168px; }
  .acard .pic {
    height: 118px; border-radius: 8px 8px 0 0; background: var(--panel-2) center/cover no-repeat;
    border: 1px solid var(--line); border-bottom: 0; position: relative; overflow: hidden;
  }
  .acard .pic.ph { display: grid; place-items: center; color: var(--ink-3); font-size: 11px; }
  .acard .pic .tag {
    position: absolute; left: 6px; top: 6px; font-size: 9px; color: #fff;
    background: rgba(0,0,0,.55); border-radius: 3px; padding: 1px 6px;
  }
  .acard .cap {
    border: 1px solid var(--line); border-radius: 0 0 8px 8px; padding: 7px 10px;
    font-size: 11.5px; background: var(--panel-2);
  }
  .acard .cap small { display: block; color: var(--ink-3); font-size: 10px; }
  .grouplab { font-size: 11px; color: var(--ink-3); margin: 0 0 8px; letter-spacing: .06em; }
  .row2 { display: flex; gap: 26px; flex-wrap: wrap; }

  /* 全屏表 mockup */
  .fs { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 640px; }
  .fs-top { display: flex; gap: 26px; align-items: center; padding: 10px 16px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 12px; }
  .fs-top .t { font-weight: 700; }
  .fs-step { display: flex; gap: 7px; align-items: center; color: var(--ink-3); }
  .fs-step .c { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font: 600 9.5px var(--mono); }
  .fs-step.on { color: var(--ink); }
  .fs-step.on .c { background: var(--green); border-color: var(--green); color: var(--bg); }
  .fs-body { padding: 14px 16px; font-size: 12px; color: var(--ink-2); }
  .shotline { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .shotline:last-child { border-bottom: 0; }
  .shotline .sn { font: 600 11px var(--mono); color: var(--ink); }
  .pill { display: inline-block; font-size: 10px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; margin: 0 4px 0 0; }

  /* 故事板 / 视频格 */
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; max-width: 880px; }
  .frame {
    position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--line);
    aspect-ratio: 16/9; background: var(--panel-2) center/cover no-repeat;
  }
  .frame .lab {
    position: absolute; left: 8px; bottom: 6px; font: 600 10px var(--mono);
    color: #fff; background: rgba(0,0,0,.55); border-radius: 3px; padding: 1px 7px;
  }
  .frame .play {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(0,0,0,.28); color: #fff; font-size: 26px;
  }
  .frame.dim { filter: saturate(.85) brightness(.9); }

  /* 合成 */
  .merge { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .merge .arrow { color: var(--ink-3); font-size: 20px; }
  .final { width: 300px; }
  .final .frame { aspect-ratio: 16/9; }
  .sum { margin-top: 20px; border-top: 1px dashed var(--line); padding-top: 14px; display: flex; gap: 26px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
  .sum b { color: var(--ink); font-size: 15px; display: block; font-family: var(--mono); }

  .navhint { margin-top: 14px; font-size: 12px; color: var(--ink-3); }
  kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--ink-2); }
  @media (prefers-reduced-motion: no-preference) {
    .scene { animation: fadein .28s ease; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
  }
</style>

const stepsEl = document.getElementById('steps');
const sceneEl = document.getElementById('scene');
let cur = 0, timer = null;

stepsEl.innerHTML = STEPS.map((s, i) =>
  '<button data-i="' + i + '"><span class="n">' + (i + 1) + '</span>' + s.t + '</button>'
).join('') + '<button class="auto" id="autoBtn">▶ 自动演示</button>';

function show(i) {
  cur = (i + STEPS.length) % STEPS.length;
  const s = STEPS[cur];
  stepsEl.querySelectorAll('button[data-i]').forEach((b, j) => {
    b.classList.toggle('on', j === cur);
    b.classList.toggle('done', j < cur);
  });
  sceneEl.innerHTML =
    '<div class="scene-head"><h2>' + (cur + 1) + ' · ' + s.t + '</h2>'
    + (s.cost ? '<span class="cost">实测花费 ' + s.cost + '</span>' : '') + '</div>'
    + '<p class="scene-sub">' + s.sub + '</p>'
    + '<div class="stage">' + s.body + '</div>'
    + '<div class="facts">' + s.facts.join('') + '</div>';
}
stepsEl.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-i]');
  if (b) { stopAuto(); show(Number(b.dataset.i)); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { stopAuto(); show(cur + 1); }
  if (e.key === 'ArrowLeft') { stopAuto(); show(cur - 1); }
});
const autoBtn = document.getElementById('autoBtn');
function stopAuto() {
  if (timer) { clearInterval(timer); timer = null; autoBtn.classList.remove('playing'); autoBtn.textContent = '▶ 自动演示'; }
}
autoBtn.addEventListener('click', () => {
  if (timer) { stopAuto(); return; }
  autoBtn.classList.add('playing'); autoBtn.textContent = '⏸ 播放中';
  show(cur + 1);
  timer = setInterval(() => show(cur + 1), 4000);
});
show(0);
</script>
