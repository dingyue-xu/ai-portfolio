<style>
/* 布局：左侧偏好面板 + 右侧工作区（广告 / 创建记录 / 编辑记录），窄屏改为上下堆叠 */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --panel2:#eef2f0; --line:#d5ddd9; --ink:#17201c; --muted:#5b6964;
  --accent:#0f7a63; --accent-ink:#ffffff; --accent-soft:#dcefe9; --warn:#b85c1e; --warn-soft:#f8e6d8;
  --add:#1d7a3a; --add-soft:#e1f2e6; --del:#b3261e; --del-soft:#f8e1df; --scrim:rgba(10,20,16,.45);
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --panel:#161e1b; --panel2:#1d2724; --line:#2c3a35; --ink:#e3ebe7; --muted:#93a39d;
  --accent:#4fc9a7; --accent-ink:#06231b; --accent-soft:#163a31; --warn:#f0a25e; --warn-soft:#3a2716;
  --add:#5fcf83; --add-soft:#16301f; --del:#f2867d; --del-soft:#3a1c1a; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --panel:#161e1b; --panel2:#1d2724; --line:#2c3a35; --ink:#e3ebe7; --muted:#93a39d;
  --accent:#4fc9a7; --accent-ink:#06231b; --accent-soft:#163a31; --warn:#f0a25e; --warn-soft:#3a2716;
  --add:#5fcf83; --add-soft:#16301f; --del:#f2867d; --del-soft:#3a1c1a; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
header.top h1{font-size:19px;margin:0;font-weight:700}
.tag{font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.top .sp{flex:1}
.actor{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.crumb{font-size:12px;color:var(--muted);margin-bottom:14px;font-family:var(--mono)}
.crumb button{background:none;border:0;color:var(--accent);padding:0;font-family:var(--mono);font-size:12px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}

.empty{color:var(--muted);font-size:12px;padding:10px 0}

.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent);background:var(--accent-soft)}
.btn{font-weight:600;font-size:13px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px}

.camp{border:1px solid var(--line);border-radius:10px;overflow:hidden}

.grp{padding:8px 12px;border-top:1px solid var(--line)}
.grp .gt{font-size:12px;color:var(--muted);margin-bottom:6px}
.ad{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0;border-top:1px dashed var(--line)}
.ad:first-of-type{border-top:0}
.ad .h{font-weight:600}
.ad .meta{grid-column:1;display:flex;flex-wrap:wrap;gap:4px}
.ad .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ad .edit{grid-row:1/3;grid-column:2;align-self:center}

.filter{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:8px}
.log{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.entry{position:relative;padding:10px 0;border-bottom:1px dashed var(--line)}
.entry::before{content:"";position:absolute;left:-22px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.entry.edit::before{background:var(--warn)}
.entry .m{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.entry .m .who{color:var(--ink)}
.badge{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid}
.badge.c{color:var(--add);border-color:var(--add);background:var(--add-soft)}
.badge.e{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.entry .w{margin-top:3px}
.diff{font-family:var(--mono);font-size:12px;margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;overflow-wrap:anywhere}
.diff .old{color:var(--del);background:var(--del-soft);text-decoration:line-through;padding:0 4px;border-radius:3px}
.diff .new{color:var(--add);background:var(--add-soft);padding:0 4px;border-radius:3px}
details.raw{margin-top:6px}
details.raw summary{font-size:12px;color:var(--muted);cursor:pointer}
details.raw pre{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0 0;max-height:180px;overflow:auto}

.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font-size:16px}
.box .sub{font-size:12px;color:var(--muted);margin-top:-6px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.hint{font-size:11px;color:var(--accent);font-family:var(--mono)}
.hint.warn{color:var(--warn)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
// @kb-logic-start  纯函数，供页面与 tests/kb_logic.test.mjs 共用
const KB = (() => {
  const median = (arr) => {
    const a = [...arr].sort((x, y) => x - y), m = a.length >> 1;
    if (!a.length) return null;
    return a.length % 2 ? a[m] : Math.round((a[m - 1] + a[m]) / 2);
  };
  const topN = (arr, n = 3) => {
    const c = new Map();
    arr.forEach((t) => c.set(t, (c.get(t) || 0) + 1));
    // 频次降序；频次相同按首次出现顺序，保证结果稳定
    return [...c.entries()].sort((a, b) => b[1] - a[1]).slice(0, n);
  };
  const charLen = (s) => [...String(s)].length; // 按字符计数，中英文都算 1
  const derive = (ads) => {
    const lens = ads.map((a) => charLen(a.headline));
    return {
      sampleSize: ads.length,
      titleRange: lens.length ? [Math.min(...lens), median(lens), Math.max(...lens)] : null,
      styleTop: topN(ads.flatMap((a) => a.imageStyleTags || [])),
      audTop: topN(ads.flatMap((a) => a.audienceTags || [])),
    };
  };
  const norm = (v) => (Array.isArray(v) ? v.join(', ') : v == null ? '' : String(v));
  // 字段级 diff：只返回真正变化的字段
  const diffFields = (oldObj, changes) =>
    Object.keys(changes)
      .filter((k) => norm(oldObj[k]) !== norm(changes[k]))
      .map((k) => ({ field: k, oldValue: norm(oldObj[k]), newValue: norm(changes[k]) }));
  const splitTags = (s) => [...new Set(String(s).split(/[,，、]/).map((t) => t.trim()).filter(Boolean))];
  return { median, topN, charLen, derive, diffFields, splitTags };
})();
if (typeof module !== 'undefined') module.exports = KB;
// @kb-logic-end
</script>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const uid = (p) => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;
const ACTORS = ['李运营', '王投放', '陈审计'];
const FIELD_NAMES = { headline: '标题', body: '正文', imageStyleTags: '图片风格', audienceTags: '受众标签' };
const TYPE_NAMES = { campaign: 'Campaign', adgroup: 'Ad Group', ad: '广告' };

// ---------- 存储：Claude Artifact 的 window.storage → localStorage → 内存 ----------
const KEY = 'proj_kb_v2';
const store = {
  async get() {
    try { if (window.storage?.get) { const r = await window.storage.get(KEY); if (r?.value) return JSON.parse(r.value); } } catch (e) {}
    try { const v = localStorage.getItem(KEY); if (v) return JSON.parse(v); } catch (e) {}
    return null;
  },
  async set(db) {
    const s = JSON.stringify(db);
    try { if (window.storage?.set) { await window.storage.set(KEY, s); return; } } catch (e) {}
    try { localStorage.setItem(KEY, s); } catch (e) {}
  },
};

function seed() {
  const P = 'p_nike_summer', C = 'p_coke_summer';

  const cl = (id, projectId, actor, ts, entityType, entityId, rawParams) => ({ id, projectId, actor, ts, entityType, entityId, rawParams });
  return {
    clients: [{ id: 'c_nike', name: 'Nike' }, { id: 'c_coke', name: '可口可乐' }],
    projects: [
      { id: P, clientId: 'c_nike', name: 'Nike 夏季跑鞋' },
      { id: 'p_nike_winter', clientId: 'c_nike', name: 'Nike 冬季羽绒服' },
      { id: C, clientId: 'c_coke', name: '可口可乐 夏日畅爽' },
    ],
    campaigns: [
      { id: 'cam_1', projectId: P, name: '夏季跑鞋 · 搜索', channel: 'Google' },
      { id: 'cam_2', projectId: P, name: '夏季跑鞋 · 信息流', channel: 'TikTok' },
      { id: 'cam_3', projectId: C, name: '畅爽一夏 · 社媒', channel: 'Meta' },
    ],
    adGroups: [
      { id: 'ag_1', projectId: P, campaignId: 'cam_1', name: '高意图关键词' },
      { id: 'ag_2', projectId: P, campaignId: 'cam_2', name: '跑步兴趣人群' },
      { id: 'ag_3', projectId: C, campaignId: 'cam_3', name: '年轻人 · 户外' },
    ],
    ads: [
      ad('ad_1', P, 'ag_1', 'Nike夏季跑鞋限时8折', '轻量缓震，夏日开跑', ['动感', '户外', '高对比'], ['跑步爱好者', '18-34', '男性']),
      ad('ad_2', P, 'ag_1', '轻量缓震 跑得更远', '全掌气垫科技', ['动感', '极简'], ['跑步爱好者', '健身人群']),
      ad('ad_3', P, 'ag_2', '夏季新色 透气网面跑鞋上市', '透气网面，清凉一夏', ['户外', '高对比', '明亮'], ['18-34', '时尚人群']),
      ad('ad_4', C, 'ag_3', '冰爽一口 夏天开盖', '冰镇才对味', ['明亮', '冰感', '特写'], ['18-24', '学生']),
      ad('ad_5', C, 'ag_3', '和朋友一起 畅爽到底', '分享装限时', ['明亮', '聚会'], ['18-24', '社交活跃']),
    ],
    createLogs: [
      cl('cl1', P, '李运营', '2026-05-03 10:12', 'campaign', 'cam_1', { name: '夏季跑鞋 · 搜索', channel: 'Google', budget: 50000 }),
      cl('cl2', P, '李运营', '2026-05-03 10:13', 'adgroup', 'ag_1', { campaignId: 'cam_1', name: '高意图关键词' }),
      cl('cl3', P, '李运营', '2026-05-03 10:15', 'ad', 'ad_1', { adGroupId: 'ag_1', headline: 'Nike夏季跑鞋上新', body: '轻量缓震，夏日开跑', imageStyleTags: ['动感', '户外', '高对比'], audienceTags: ['跑步爱好者', '18-34', '男性'] }),
      cl('cl4', P, '王投放', '2026-05-06 14:40', 'ad', 'ad_2', { adGroupId: 'ag_1', headline: '轻量缓震 跑得更远', body: '全掌气垫科技', imageStyleTags: ['动感', '极简'], audienceTags: ['跑步爱好者', '健身人群'] }),
      cl('cl5', P, '王投放', '2026-05-08 09:30', 'campaign', 'cam_2', { name: '夏季跑鞋 · 信息流', channel: 'TikTok', budget: 30000 }),
      cl('cl6', P, '王投放', '2026-05-08 09:31', 'adgroup', 'ag_2', { campaignId: 'cam_2', name: '跑步兴趣人群' }),
      cl('cl7', P, '王投放', '2026-05-09 09:05', 'ad', 'ad_3', { adGroupId: 'ag_2', headline: '夏季新色 透气网面跑鞋上市', body: '透气网面，清凉一夏', imageStyleTags: ['户外', '高对比', '明亮'], audienceTags: ['18-34', '时尚人群'] }),
      cl('cl8', C, '李运营', '2026-06-01 11:00', 'campaign', 'cam_3', { name: '畅爽一夏 · 社媒', channel: 'Meta', budget: 80000 }),
      cl('cl9', C, '李运营', '2026-06-01 11:02', 'adgroup', 'ag_3', { campaignId: 'cam_3', name: '年轻人 · 户外' }),
      cl('cl10', C, '李运营', '2026-06-01 11:05', 'ad', 'ad_4', { adGroupId: 'ag_3', headline: '冰爽一口 夏天开盖', body: '冰镇才对味', imageStyleTags: ['明亮', '冰感', '特写'], audienceTags: ['18-24', '学生'] }),
      cl('cl11', C, '李运营', '2026-06-01 11:08', 'ad', 'ad_5', { adGroupId: 'ag_3', headline: '和朋友一起 畅爽到底', body: '分享装限时', imageStyleTags: ['明亮', '聚会'], audienceTags: ['18-24', '社交活跃'] }),
    ],
    editLogs: [
      { id: 'el1', projectId: P, actor: '王投放', ts: '2026-05-07 11:20', entityType: 'ad', entityId: 'ad_1', field: 'headline', oldValue: 'Nike夏季跑鞋上新', newValue: 'Nike夏季跑鞋限时8折' },
    ],
  };
}

// ---------- 模拟后端：所有读写都先按 projectId 过滤 ----------
let DB = null;
const save = () => store.set(DB);
const api = {
  projects: () => DB.projects.map((p) => ({ ...p, client: DB.clients.find((c) => c.id === p.clientId)?.name,
    adCount: DB.ads.filter((a) => a.projectId === p.id).length })),
  tree: (pid) => DB.campaigns.filter((c) => c.projectId === pid).map((c) => ({ ...c,
    groups: DB.adGroups.filter((g) => g.projectId === pid && g.campaignId === c.id).map((g) => ({ ...g,
      ads: DB.ads.filter((a) => a.projectId === pid && a.adGroupId === g.id) })) })),
  logs: (pid) => ({
    create: DB.createLogs.filter((l) => l.projectId === pid).sort((a, b) => b.ts.localeCompare(a.ts)),
    edit: DB.editLogs.filter((l) => l.projectId === pid).sort((a, b) => b.ts.localeCompare(a.ts)),
  }),
  preferences: (pid) => KB.derive(DB.ads.filter((a) => a.projectId === pid)),
  // POST /projects/:id/ads：按需新建 Campaign / Ad Group，每个实体各写一条 CreateLog
  createAd(pid, input, actor) {
    const ts = now(), logs = [];
    let campaignId = input.campaignId, adGroupId = input.adGroupId;
    if (campaignId === '__new') {
      campaignId = uid('cam');
      const c = { id: campaignId, projectId: pid, name: input.newCampaign, channel: input.channel };
      DB.campaigns.push(c);
      logs.push({ entityType: 'campaign', entityId: campaignId, rawParams: { name: c.name, channel: c.channel } });
    }
    if (adGroupId === '__new') {
      adGroupId = uid('ag');
      DB.adGroups.push({ id: adGroupId, projectId: pid, campaignId, name: input.newAdGroup });
      logs.push({ entityType: 'adgroup', entityId: adGroupId, rawParams: { campaignId, name: input.newAdGroup } });
    }
    const id = uid('ad');
    const ad = { id, projectId: pid, adGroupId, headline: input.headline, body: input.body,
      imageStyleTags: input.imageStyleTags, audienceTags: input.audienceTags };
    DB.ads.push(ad);
    logs.push({ entityType: 'ad', entityId: id, rawParams: { adGroupId, headline: ad.headline, body: ad.body,
      imageStyleTags: ad.imageStyleTags, audienceTags: ad.audienceTags } });
    logs.forEach((l) => DB.createLogs.push({ id: uid('cl'), projectId: pid, actor, ts, ...l }));
    save();
    return { id, entities: logs.length };
  },
  // PATCH /projects/:id/ads/:adId：只记录真正变化的字段
  editAd(pid, adId, changes, actor) {
    const ad = DB.ads.find((a) => a.id === adId && a.projectId === pid);
    if (!ad) return 0;
    const diffs = KB.diffFields(ad, changes), ts = now();
    diffs.forEach((d) => {
      DB.editLogs.push({ id: uid('el'), projectId: pid, actor, ts, entityType: 'ad', entityId: adId, ...d });
      ad[d.field] = changes[d.field];
    });
    save();
    return diffs.length;
  },
};

// ---------- 视图 ----------
const state = { view: 'projects', pid: null, tab: 'ads', actor: ACTORS[0], who: '' };
function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
const chips = (pairs) => pairs.length
  ? `<div class="chips">${pairs.map(([t, n]) => `<span class="chip">${esc(t)} <b>×${n}</b></span>`).join('')}</div>`
  : '<div class="empty">暂无数据</div>';
const tagChips = (tags) => tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('');

function render() {
  const app = $('#app');
  app.innerHTML = `<div class="wrap">
    <header class="top">
      <h1>项目知识库</h1><span class="tag">审计台账 + 偏好引擎</span><span class="sp"></span>
      <label class="actor" for="actor">当前操作人
        <select id="actor">${ACTORS.map((a) => `<option ${a === state.actor ? 'selected' : ''}>${a}</option>`).join('')}</select>
      </label>
      <button class="btn ghost sm" id="reset" type="button">重置示例数据</button>
    </header>
    ${state.view === 'projects' ? projectsView() : projectView()}
  </div>`;
  $('#actor').onchange = (e) => { state.actor = e.target.value; };
  $('#reset').onclick = async () => { DB = seed(); await save(); state.view = 'projects'; render(); toast('已恢复示例数据'); };
  if (state.view === 'projects') {
    app.querySelectorAll('[data-pid]').forEach((b) => b.onclick = () => { state.view = 'project'; state.pid = b.dataset.pid; state.tab = 'ads'; state.who = ''; render(); });
  } else wireProject();
}

function projectsView() {
  return `<div class="crumb">全部项目 · 每个项目是完全隔离的独立知识库</div>
  <div class="cards">${api.projects().map((p) => `
    <button class="card" type="button" data-pid="${esc(p.id)}">
      <h3>${esc(p.name)}</h3>
      <span class="sub">客户 ${esc(p.client)} · ${p.adCount} 条广告</span>
      <span class="note">${p.adCount ? '已积累历史偏好' : '新项目，暂无历史'}</span>
    </button>`).join('')}</div>`;
}

function projectView() {
  const p = DB.projects.find((x) => x.id === state.pid);
  const pref = api.preferences(state.pid), logs = api.logs(state.pid);
  const tr = pref.titleRange;
  const left = `<aside class="panel"><h2>策略偏好 · 实时派生</h2><div class="pref">
    <div><div class="k">标题长度（字符）</div>${tr ? `<div class="meter">${tr[0]}–${tr[2]}<small>中位 ${tr[1]}</small></div>` : '<div class="empty">暂无广告，创建第一条后开始派生</div>'}</div>
    <div><div class="k">图片风格 Top 3</div>${chips(pref.styleTop)}</div>
    <div><div class="k">高频受众 Top 3</div>${chips(pref.audTop)}</div>
    <div class="note">基于本项目 ${pref.sampleSize} 条广告计算，不读取其他项目的数据。</div>
  </div></aside>`;
  const tabs = [['ads', `广告 (${DB.ads.filter((a) => a.projectId === state.pid).length})`], ['create', `创建记录 (${logs.create.length})`], ['edit', `编辑记录 (${logs.edit.length})`]];
  let body = '';
  if (state.tab === 'ads') body = adsTree();
  else {
    const items = (state.tab === 'create' ? logs.create : logs.edit).filter((l) => !state.who || l.actor === state.who);
    body = `<div class="filter"><label for="who">按操作人筛选</label><select id="who"><option value="">全部</option>${ACTORS.map((a) => `<option ${a === state.who ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
      <div class="log">${items.length ? items.map(state.tab === 'create' ? createEntry : editEntry).join('') : '<div class="empty">暂无记录</div>'}</div>`;
  }
  return `<div class="crumb"><button type="button" id="back">← 全部项目</button> / ${esc(p.name)}</div>
  <div class="layout">${left}
    <section class="panel">
      <div class="toolbar"><div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" class="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}</button>`).join('')}</div>
        <button class="btn" type="button" id="newAd">+ 新建广告</button></div>
      ${body}
    </section></div>`;
}

function adsTree() {
  const t = api.tree(state.pid);
  if (!t.length) return '<div class="empty">这个项目还没有 Campaign。点击“新建广告”，可以一次创建 Campaign、Ad Group 和第一条广告。</div>';
  return `<div class="tree">${t.map((c) => `<div class="camp"><div class="hd">${esc(c.name)} <span class="chip">${esc(c.channel || '')}</span></div>
    ${c.groups.map((g) => `<div class="grp"><div class="gt">Ad Group · ${esc(g.name)}</div>
      ${g.ads.length ? g.ads.map((a) => `<div class="ad"><div><span class="h">${esc(a.headline)}</span> <span class="id">${esc(a.id)}</span></div>
        <div class="meta">${tagChips(a.imageStyleTags)}${tagChips(a.audienceTags)}</div>
        <button class="btn ghost sm edit" type="button" data-edit="${esc(a.id)}">编辑</button></div>`).join('') : '<div class="empty">暂无广告</div>'}
    </div>`).join('')}</div>`).join('')}</div>`;
}
const createEntry = (it) => `<div class="entry"><div class="m"><span class="badge c">CREATE</span><span class="who">${esc(it.actor)}</span><span>${esc(it.ts)}</span></div>
  <div class="w">创建了 ${TYPE_NAMES[it.entityType] || esc(it.entityType)} <b class="mono">${esc(it.entityId)}</b></div>
  <details class="raw"><summary>原始输入参数</summary><pre>${esc(JSON.stringify(it.rawParams, null, 2))}</pre></details></div>`;
const editEntry = (it) => `<div class="entry edit"><div class="m"><span class="badge e">EDIT</span><span class="who">${esc(it.actor)}</span><span>${esc(it.ts)}</span></div>
  <div class="w">修改 ${TYPE_NAMES[it.entityType] || esc(it.entityType)} <b class="mono">${esc(it.entityId)}</b> 的 ${FIELD_NAMES[it.field] || esc(it.field)}</div>
  <div class="diff"><span class="old">${esc(it.oldValue) || '（空）'}</span>→<span class="new">${esc(it.newValue) || '（空）'}</span></div></div>`;

function wireProject() {
  $('#back').onclick = () => { state.view = 'projects'; render(); };
  document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  const who = $('#who'); if (who) who.onchange = (e) => { state.who = e.target.value; render(); };
  $('#newAd').onclick = openNewAd;
  document.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => openEdit(b.dataset.edit));
}

function modal(html) {
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  m.addEventListener('click', (e) => { if (e.target === m) close(); });
  m.querySelector('[data-close]').onclick = close;
  setTimeout(() => m.querySelector('input,select,textarea')?.focus(), 0);
  return { m, close };
}
function tagPicker(id, suggestions, selected) {
  const all = [...new Set([...suggestions, ...selected])];
  return `<div class="chips" id="${id}_chips">${all.map((t) => `<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="${selected.includes(t)}">${esc(t)}</button>`).join('')}</div>
    <input id="${id}" placeholder="补充标签，用逗号分隔">`;
}
function readTags(m, id) {
  const picked = [...m.querySelectorAll(`#${id}_chips [aria-pressed="true"]`)].map((b) => b.dataset.tag);
  return KB.splitTags([...picked, $('#' + id, m).value].join(','));
}
function wireTags(m) { m.querySelectorAll('[data-tag]').forEach((b) => b.onclick = () => b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'))); }
function lengthHint(m, inputId, hintId, tr) {
  const el = $('#' + inputId, m), hint = $('#' + hintId, m);
  const upd = () => {
    const n = KB.charLen(el.value.trim());
    if (!tr) { hint.textContent = `${n} 字符 · 本项目暂无历史标题`; hint.className = 'hint'; return; }
    const off = n && (n < tr[0] || n > tr[2]);
    hint.textContent = `${n} 字符 · 历史范围 ${tr[0]}–${tr[2]}，中位 ${tr[1]}${off ? '（超出历史范围）' : ''}`;
    hint.className = off ? 'hint warn' : 'hint';
  };
  el.addEventListener('input', upd); upd();
}

function openNewAd() {
  const pid = state.pid, pref = api.preferences(pid), tree = api.tree(pid);
  const styles = pref.styleTop.map((s) => s[0]), auds = pref.audTop.map((s) => s[0]);
  const { m, close } = modal(`<h2>新建广告</h2><div class="sub">${pref.sampleSize ? '已根据本项目历史预填风格与受众，可直接修改' : '新项目没有历史可参考，填写后会成为第一批偏好数据'}</div>
    <div class="row2">
      <div class="field"><label for="f_cam">Campaign</label><select id="f_cam">${tree.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}<option value="__new">+ 新建 Campaign</option></select></div>
      <div class="field"><label for="f_ag">Ad Group</label><select id="f_ag"></select></div>
    </div>
    <div class="row2" id="newCamRow" hidden>
      <div class="field"><label for="f_cam_name">新 Campaign 名称</label><input id="f_cam_name"></div>
      <div class="field"><label for="f_ch">渠道</label><select id="f_ch"><option>Google</option><option>TikTok</option><option>Meta</option></select></div>
    </div>
    <div class="field" id="newAgRow" hidden><label for="f_ag_name">新 Ad Group 名称</label><input id="f_ag_name"></div>
    <div class="field"><label for="f_h">标题</label><input id="f_h" placeholder="输入广告标题"><div class="hint" id="f_h_hint"></div></div>
    <div class="field"><label for="f_b">正文</label><textarea id="f_b" rows="2"></textarea></div>
    <div class="field"><label>图片风格（点选或补充）</label>${tagPicker('f_s', styles, styles)}</div>
    <div class="field"><label>受众标签（点选或补充）</label>${tagPicker('f_a', auds, auds)}</div>
    <div class="hint warn" id="f_err" hidden></div>
    <div class="actions"><button class="btn ghost" type="button" data-close>取消</button><button class="btn" type="button" id="f_save">创建并归档</button></div>`);
  wireTags(m);
  lengthHint(m, 'f_h', 'f_h_hint', pref.titleRange);
  const cam = $('#f_cam', m), ag = $('#f_ag', m);
  const fillAg = () => {
    const c = tree.find((x) => x.id === cam.value);
    ag.innerHTML = (c ? c.groups.map((g) => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('') : '') + '<option value="__new">+ 新建 Ad Group</option>';
    $('#newCamRow', m).hidden = cam.value !== '__new';
    $('#newAgRow', m).hidden = ag.value !== '__new';
  };
  cam.onchange = fillAg; ag.onchange = () => { $('#newAgRow', m).hidden = ag.value !== '__new'; };
  fillAg();
  $('#f_save', m).onclick = () => {
    const input = { campaignId: cam.value, adGroupId: ag.value, newCampaign: $('#f_cam_name', m).value.trim(), channel: $('#f_ch', m).value,
      newAdGroup: $('#f_ag_name', m).value.trim(), headline: $('#f_h', m).value.trim(), body: $('#f_b', m).value.trim(),
      imageStyleTags: readTags(m, 'f_s'), audienceTags: readTags(m, 'f_a') };
    const err = $('#f_err', m);
    const missing = !input.headline ? '请填写标题' : input.campaignId === '__new' && !input.newCampaign ? '请填写新 Campaign 名称'
      : input.adGroupId === '__new' && !input.newAdGroup ? '请填写新 Ad Group 名称' : '';
    if (missing) { err.textContent = missing; err.hidden = false; return; }
    const r = api.createAd(pid, input, state.actor);
    close(); state.tab = 'create'; render(); toast(`已创建并归档 ${r.entities} 条创建记录`);
  };
}

function openEdit(adId) {
  const pid = state.pid, ad = DB.ads.find((a) => a.id === adId && a.projectId === pid), pref = api.preferences(pid);
  const { m, close } = modal(`<h2>编辑广告</h2><div class="sub mono">${esc(ad.id)} · 只有改动过的字段会写入编辑记录</div>
    <div class="field"><label for="e_h">标题</label><input id="e_h" value="${esc(ad.headline)}"><div class="hint" id="e_h_hint"></div></div>
    <div class="field"><label for="e_b">正文</label><textarea id="e_b" rows="2">${esc(ad.body || '')}</textarea></div>
    <div class="field"><label>图片风格</label>${tagPicker('e_s', pref.styleTop.map((s) => s[0]), ad.imageStyleTags)}</div>
    <div class="field"><label>受众标签</label>${tagPicker('e_a', pref.audTop.map((s) => s[0]), ad.audienceTags)}</div>
    <div class="actions"><button class="btn ghost" type="button" data-close>取消</button><button class="btn" type="button" id="e_save">保存修改</button></div>`);
  wireTags(m);
  lengthHint(m, 'e_h', 'e_h_hint', pref.titleRange);
  $('#e_save', m).onclick = () => {
    const changes = { headline: $('#e_h', m).value.trim(), body: $('#e_b', m).value.trim(),
      imageStyleTags: readTags(m, 'e_s'), audienceTags: readTags(m, 'e_a') };
    if (!changes.headline) { $('#e_h', m).focus(); return; }
    const n = api.editAd(pid, adId, changes, state.actor);
    close();
    if (n) { state.tab = 'edit'; render(); toast(`已记录 ${n} 个字段的修改`); } else toast('没有改动，未产生编辑记录');
  };
}

(async () => { DB = (await store.get()) || seed(); render(); })();
})();
</script>
</body>
</html>
