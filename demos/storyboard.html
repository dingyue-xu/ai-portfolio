<style>
:root{
  --ground:#F6F5F3; --surface:#FFFFFF; --surface-2:#EDEBE8; --sunk:#E4E1DC;
  --ink:#1A1A19; --ink-2:#3D3C38; --muted:#726F68;
  --line:#DEDBD5; --line-2:#C4C0B8;
  --accent:#A6412A; --accent-ink:#A6412A; --accent-soft:#F6EAE6;
  --ok:#3F6B45; --bad:#A6412A;
  --sans:'Archivo','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131312; --surface:#1B1B19; --surface-2:#232320; --sunk:#100F0E;
    --ink:#EDECE8; --ink-2:#BDBBB4; --muted:#8B887F;
    --line:#2C2C28; --line-2:#3D3C37;
    --accent:#E08060; --accent-ink:#EE9B7E; --accent-soft:#2A1C17;
    --ok:#7FBF89; --bad:#E08060;
  }
}
:root[data-theme="dark"]{
  --ground:#131312; --surface:#1B1B19; --surface-2:#232320; --sunk:#100F0E;
  --ink:#EDECE8; --ink-2:#BDBBB4; --muted:#8B887F;
  --line:#2C2C28; --line-2:#3D3C37;
  --accent:#E08060; --accent-ink:#EE9B7E; --accent-soft:#2A1C17;
  --ok:#7FBF89; --bad:#E08060;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px}
.tb-name{font-weight:600;font-size:14px;letter-spacing:-.01em}
.tb-tag{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:2px;padding:2px 6px}
.tb-sp{flex:1}
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;flex-shrink:0}
.lang button{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.lang button+button{border-left:1px solid var(--line-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

section{padding-block:50px;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
.slate{display:inline-flex;align-items:center;gap:0;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;margin-bottom:14px}
.slate i{font-style:normal;background:var(--ink);color:var(--ground);padding:3px 7px;border-radius:2px 0 0 2px}
.slate span{background:var(--surface-2);color:var(--muted);padding:3px 9px;border:1px solid var(--line);border-left:0;border-radius:0 2px 2px 0;text-transform:uppercase}
h1{font-size:clamp(27px,5vw,41px);line-height:1.13;letter-spacing:-.027em;font-weight:700;margin:0 0 14px;text-wrap:balance;max-width:19ch}
h2{font-size:clamp(19px,2.9vw,25px);line-height:1.25;letter-spacing:-.02em;font-weight:600;margin:0 0 12px;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0 0 5px;letter-spacing:-.005em}
p{margin:0 0 14px;color:var(--ink-2);max-width:66ch}
p:last-child{margin-bottom:0}
strong{color:var(--ink);font-weight:600}
.lede{font-size:17px;line-height:1.58;color:var(--ink-2);max-width:58ch}
.hero{padding-top:44px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.chip{font-family:var(--mono);font-size:11px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:3px 8px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:12px 14px;margin-top:26px}
.notice .ic{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent-ink);letter-spacing:.09em;flex-shrink:0;padding-top:3px}
.notice p{margin:0;font-size:13px;line-height:1.6}

.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:10px}
.scroller svg{display:block;min-width:860px;width:100%;height:auto}
.fg-box{fill:var(--surface-2);stroke:var(--line-2)}
.fg-acc{fill:var(--accent-soft);stroke:var(--accent)}
.fg-t{fill:var(--ink);font-family:var(--sans);font-size:12.5px;font-weight:600}
.fg-s{fill:var(--muted);font-family:var(--mono);font-size:9.6px}
.fg-n{fill:var(--muted);font-family:var(--mono);font-size:9px;letter-spacing:.09em}
.fg-l{stroke:var(--line-2);fill:none;stroke-width:1.4}
.fg-lb{stroke:var(--accent);fill:none;stroke-width:1.4;stroke-dasharray:4 3}
.cap{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}

.layers{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:20px}
.ly{background:var(--surface);padding:15px 17px;display:grid;grid-template-columns:120px 1fr;gap:4px 18px;align-items:start}
@media(max-width:620px){.ly{grid-template-columns:1fr;gap:6px}}
.ly .tagn{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;padding-top:2px}
.ly h3{margin-bottom:3px}
.ly p{font-size:13.5px;margin:0;line-height:1.55}
.ly .ex{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--sunk);border-radius:3px;padding:9px 11px;margin-top:9px;line-height:1.75;white-space:pre-wrap}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.rub th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 14px 9px 0;border-bottom:1px solid var(--line-2)}
.rub td{padding:13px 14px 13px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
.rub td:first-child{white-space:nowrap;color:var(--ink);font-weight:600}
.rub code{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:2px;padding:1px 5px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
.col{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:4px;padding:16px}
.col p{font-size:13.5px;margin:0;line-height:1.56}

.own{margin-top:18px;border-top:1px solid var(--line)}
.own .r{display:grid;grid-template-columns:160px 1fr;gap:4px 20px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13.5px}
@media(max-width:620px){.own .r{grid-template-columns:1fr;gap:4px}}
.own .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.own .v{color:var(--ink-2)}
.own .v b{color:var(--ink);font-weight:600}

footer{padding-block:32px 44px;font-size:13px;color:var(--muted)}
.ft{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

.demo{border:1px solid var(--line-2);border-radius:6px;background:var(--surface);overflow:hidden;margin-top:20px}
.demo-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--muted);flex-wrap:wrap}
.demo-bar b{color:var(--accent-ink);font-weight:700;letter-spacing:.06em}
.demo-in{padding:16px 16px 4px}
.demo-in label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.demo-in input[type=text]{width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--sunk);border:1px solid var(--line-2);border-radius:4px;padding:9px 11px}
.segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:14px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:3px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"],:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#131312}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .seg button[aria-pressed="true"]{color:#fff}}
.demo-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);margin-top:16px}
@media(max-width:760px){.demo-split{grid-template-columns:1fr}}
.demo-pane{background:var(--surface);padding:14px 16px}
.demo-pane .ph{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.out{font-family:var(--mono);font-size:11.5px;line-height:1.85;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.out .kk{color:var(--accent-ink);font-weight:500}
.shot{border:1px solid var(--line);border-radius:4px;padding:9px 11px;margin-bottom:7px;background:var(--sunk)}
.shot:last-child{margin-bottom:0}
.shot .sn{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.shot .sd{font-size:12.5px;color:var(--ink);margin-top:2px;line-height:1.45}
.shot .bs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.bdg{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:2px;border:1px solid;white-space:nowrap}
.bdg.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.bdg.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.retry{font-family:var(--mono);font-size:10.5px;color:var(--accent-ink);margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    'mo.4':'even light, low contrast, desaturated'
  };
  var PICK = { style:'st.1', shot:'sh.2', mood:'mo.1' };
  var VERDICT = [
    { id:true,  vis:true,  tmp:true  },
    { id:true,  vis:true,  tmp:true  },
    { id:false, vis:true,  tmp:true  },
    { id:true,  vis:true,  tmp:true  }
  ];

  function esc(x){ return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function buildSegs(){
    ['style','shot','mood'].forEach(function(g){
      var el = document.getElementById('seg-' + g);
      if (!el) return;
      el.innerHTML = SEGS[g].map(function(k){
        return '<button type="button" data-g="' + g + '" data-k="' + k + '" aria-pressed="' + (PICK[g]===k) + '">' + esc(t(k)) + '</button>';
      }).join('');
    });
  }

  function renderDemo(){
    var ideaEl = document.getElementById('idea');
    if (!ideaEl) return;
    var idea = ideaEl.value.trim() || t('pd.idea');
    var st = TOK[PICK.style], sh = TOK[PICK.shot], mo = TOK[PICK.mood];
    document.getElementById('out-prompt').innerHTML =
      '<span class="kk">positive</span>   = ' + esc(idea) + ', identity_anchor, ' + esc(st) + ', ' + esc(sh) + ', ' + esc(mo) + '\n\n'
      + '<span class="kk">negative</span>   = extra fingers, warped proportions, style contamination,\n              inconsistent face, duplicated subject\n\n'
      + '<span class="kk">parameters</span> = sampler=tier_' + (PICK.style.slice(-1)) + ' · steps=preset · weights=locked · ratio=9:16';

    var shots = ['pd.s1','pd.s2','pd.s3','pd.s4'];
    document.getElementById('out-shots').innerHTML = shots.map(function(k, i){
      var v = VERDICT[i];
      function b(ok, lab){ return '<span class="bdg ' + (ok?'ok':'no') + '">' + (ok?'✓':'✕') + ' ' + esc(t(lab)) + '</span>'; }
      return '<div class="shot"><div class="sn">SHOT 0' + (i+1) + ' · ' + esc(t(PICK.shot)) + '</div>'
        + '<div class="sd">' + esc(t(k)) + '</div>'
        + '<div class="bs">' + b(v.id,'bd.id') + b(v.vis,'bd.vis') + b(v.tmp,'bd.tmp') + '</div>'
        + (v.id && v.vis && v.tmp ? '' : '<div class="retry">↺ ' + esc(t('pd.retry')) + '</div>')
        + '</div>';
    }).join('');
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('.seg button[data-g]');
    if (!b) return;
    PICK[b.getAttribute('data-g')] = b.getAttribute('data-k');
    buildSegs(); renderDemo();
  });
  (function(){
    var i = document.getElementById('idea');
    if (i) i.addEventListener('input', function(){ i.dataset.touched = '1'; renderDemo(); });
  })();

  function render(){
    document.documentElement.lang = (lang === 'zh' ? 'zh-CN' : 'en');
    try { document.title = DOCTITLE[lang]; } catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(el){
      var v = t(el.getAttribute('data-i18n'));
      if (el.namespaceURI && el.namespaceURI.indexOf('svg') !== -1) el.textContent = v;
      else el.innerHTML = v;
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-attr]'), function(el){
      var p = el.getAttribute('data-i18n-attr').split('|');
      el.setAttribute(p[0], t(p[1]));
    });
    Array.prototype.forEach.call(document.querySelectorAll('#lang button'), function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
    });
    var ie = document.getElementById('idea');
    if (ie) { ie.placeholder = t('pd.idea'); if (!ie.dataset.touched) ie.value = t('pd.idea'); }
    buildSegs(); renderDemo();
  }

  document.getElementById('lang').addEventListener('click', function(e){
    var b = e.target.closest('button[data-lang]');
    if (!b) return;
    lang = b.getAttribute('data-lang');
    try { localStorage.setItem('sbn.lang', lang); } catch(e2){}
    render();
  });

  var saved = null;
  try { saved = localStorage.getItem('sbn.lang'); } catch(e){}
  if (saved === 'zh' || saved === 'en') lang = saved;
  else lang = (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';

  render();
})();
</script>

</body></html>
